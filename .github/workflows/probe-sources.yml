name: Probe award sites

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run: GitHub's servers or a self-hosted runner on your own machine"
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser
        run: |
          pip install --quiet playwright
          if [ "${{ inputs.runner }}" = "ubuntu-latest" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Probe each site
        run: python probe_sources.py
