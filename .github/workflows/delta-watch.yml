name: Delta award sale watch

on:
  schedule:
    # Hourly. GitHub honoured only 2 of 6 three-hourly slots in a day, so
    # ask far more often than the ~72h sale window needs and let it drop some.
    - cron: "17 * * * *"
  workflow_dispatch:          # manual "Run workflow" button for testing
    inputs:
      test_email:
        description: "Send a test email to verify SMTP, then stop"
        type: boolean
        default: false
      drill:
        description: "Send a drill alert through the real match path, then stop"
        type: boolean
        default: false
      diagnose:
        description: "Print which live posts would alert and why; send nothing"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job commit seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds and alert
        run: python monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
          DRILL: ${{ inputs.drill }}
          DIAGNOSE: ${{ inputs.diagnose }}

      - name: Persist seen items
        run: |
          git config user.name "delta-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json state.json
          git diff --cached --quiet || (git commit -m "chore: update seen items" && git push)
