name: Delta award sale watch

on:
  schedule:
    # Every 3h UTC. GitHub may delay scheduled runs
    # by hours under load and drop slots, so poll twice as often as needed.
    - cron: "17 */3 * * *"
  workflow_dispatch:          # manual "Run workflow" button for testing
    inputs:
      test_email:
        description: "Send a test email to verify SMTP, then stop"
        type: boolean
        default: false
      drill:
        description: "Send a drill alert through the real match path, then stop"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job commit seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds and alert
        run: python monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
          DRILL: ${{ inputs.drill }}

      - name: Persist seen items
        run: |
          git config user.name "delta-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "chore: update seen items" && git push)
