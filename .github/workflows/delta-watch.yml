name: Delta award sale watch

on:
  schedule:
    # UTC: 00:17, 06:17, 12:17, 18:17. GitHub may delay scheduled runs
    # by 5-30 min under load, which is fine for a ~72h flash sale.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}       # manual "Run workflow" button for testing

permissions:
  contents: write             # lets the job commit seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds and alert
        run: python monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      - name: Persist seen items
        run: |
          git config user.name "delta-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "chore: update seen items" && git push)
